<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Products | Seller Portal</title>
  <link rel="stylesheet" href="css/seller.css">
</head>
<body>
  <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="seller-sidebar">Menu</button>
  <div class="app">
    <aside class="sidebar" id="seller-sidebar" aria-label="Seller navigation"></aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h1>My Products</h1>
          <p>Manage your listings and stock levels.</p>
        </div>
        <a class="btn btn--primary" href="add-product.html">+ Add Product</a>
      </header>

      <section class="card" aria-label="Product list">
        <form class="toolbar" id="filters" role="search" onsubmit="return false">
          <div class="field field--grow">
            <label for="search">Search products</label>
            <input type="search" id="search" placeholder="Search by name&hellip;" autocomplete="off">
          </div>
          <div class="field">
            <label for="filter-category">Category</label>
            <select id="filter-category"><option value="">All categories</option></select>
          </div>
          <div class="field">
            <label for="filter-stock">Availability</label>
            <select id="filter-stock">
              <option value="">All</option>
              <option value="in">In Stock</option>
              <option value="low">Low Stock</option>
              <option value="out">Out of Stock</option>
            </select>
          </div>
          <div class="field">
            <label for="filter-status">Listing</label>
            <select id="filter-status">
              <option value="">All</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </form>

        <div class="table-wrap" id="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Product</th><th scope="col">Category</th>
                <th scope="col" class="num">Price</th><th scope="col" class="num">Stock</th>
                <th scope="col">Availability</th><th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="product-rows"></tbody>
          </table>
        </div>

        <div class="empty" id="empty-state" hidden></div>
        <p class="sub" id="result-count" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/seller-layout.js"></script>
  <script src="js/seller-products.js"></script>
</body>
</html>
