<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Logs - MarketHub Super Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="py-12">
    <div class="container">
      
      <!-- Page Header -->
      <div class="admin-page-header">
        <div class="admin-title-area">
          <h1>📜 System Audit Trail & Security Logs</h1>
          <p class="admin-subtitle">Inspect chronological system operations, security triggers, and IP addresses across all vertical slices.</p>
        </div>
        <div class="flex gap-3">
          <button id="refresh-logs-btn" class="btn btn-primary btn-sm">🔄 Refresh Logs</button>
        </div>
      </div>

      <!-- Filter Toolbar -->
      <div class="admin-toolbar">
        <div class="toolbar-filters">
          <div class="search-input-box">
            <input type="text" id="log-search-input" class="form-input" placeholder="Search by description, action, or IP...">
          </div>
          
          <select id="log-action-filter" class="form-select" style="max-width: 190px;">
            <option value="ALL">All Actions</option>
            <option value="CATEGORY_CREATE">CATEGORY_CREATE</option>
            <option value="CATEGORY_UPDATE">CATEGORY_UPDATE</option>
            <option value="CATEGORY_DELETE">CATEGORY_DELETE</option>
            <option value="SELLER_APPROVE">SELLER_APPROVE</option>
            <option value="USER_BLOCK">USER_BLOCK</option>
            <option value="ADMIN_CREATE">ADMIN_CREATE</option>
            <option value="LOGIN">LOGIN</option>
          </select>

          <select id="log-role-filter" class="form-select" style="max-width: 160px;">
            <option value="ALL">All Users</option>
            <option value="Super Admin">Super Admin</option>
            <option value="Admin">Admin</option>
            <option value="System">System / Guest</option>
          </select>
        </div>
        <div class="text-sm text-muted">
          Showing <span id="log-count" class="font-bold">6</span> events
        </div>
      </div>

      <!-- Logs Table -->
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th style="width: 80px;">Log ID</th>
              <th style="width: 180px;">Timestamp</th>
              <th style="width: 200px;">User / Role</th>
              <th style="width: 180px;">Action Verb</th>
              <th>Description</th>
              <th style="width: 140px; text-align: right;">Client IP</th>
            </tr>
          </thead>
          <tbody id="logs-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    const user = requireRole('Super Admin');

    let logs = [];

    const tbody = document.getElementById('logs-table-body');
    const searchInput = document.getElementById('log-search-input');
    const actionFilter = document.getElementById('log-action-filter');
    const roleFilter = document.getElementById('log-role-filter');

    async function loadLogs() {
      if (!user) return;
      try {
        const queryParams = new URLSearchParams();
        if (actionFilter.value !== 'ALL') queryParams.append('action', actionFilter.value);
        if (roleFilter.value !== 'ALL') queryParams.append('role', roleFilter.value);
        if (searchInput.value.trim()) queryParams.append('search', searchInput.value.trim());

        const endpoint = `/superadmin/logs${queryParams.toString() ? '?' + queryParams.toString() : ''}`;
        const res = await apiFetch(endpoint);
        if (res && res.data && res.data.logs) {
          logs = res.data.logs;
        }
      } catch (err) {
        console.warn('API error loading logs, using cached state:', err.message);
      }
      renderLogs();
    }

    function renderLogs() {
      const q = searchInput.value.toLowerCase().trim();
      const action = actionFilter.value;
      const role = roleFilter.value;

      const filtered = logs.filter(l => {
        const matchesQuery = (l.description && l.description.toLowerCase().includes(q)) || 
                             (l.action && l.action.toLowerCase().includes(q)) || 
                             (l.ip_address && l.ip_address.includes(q)) ||
                             (l.user_email && l.user_email.toLowerCase().includes(q)) ||
                             (l.user_name && l.user_name.toLowerCase().includes(q));
        const matchesAction = action === 'ALL' || l.action === action;
        const matchesRole = role === 'ALL' || (l.user_role === role) || (role === 'System' && !l.user_role);
        return matchesQuery && matchesAction && matchesRole;
      });

      document.getElementById('log-count').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-muted">No audit logs found matching criteria.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(l => {
        const dateStr = l.created_at ? new Date(l.created_at).toLocaleString() : '—';
        const displayUser = l.user_email || l.user_name || 'System / Anonymous';
        const displayRole = l.user_role || 'System';
        return `
          <tr>
            <td><span class="font-mono text-muted text-sm">#${l.log_id}</span></td>
            <td class="text-sm text-muted">${dateStr}</td>
            <td>
              <div class="font-bold text-sm">${escapeHtml(displayUser)}</div>
              <span class="badge ${displayRole === 'Super Admin' ? 'badge-danger' : (displayRole === 'Admin' ? 'badge-warning' : 'badge-secondary')}" style="font-size: 0.65rem;">
                ${displayRole}
              </span>
            </td>
            <td><span class="code-badge">${escapeHtml(l.action)}</span></td>
            <td class="text-sm">${escapeHtml(l.description)}</td>
            <td style="text-align: right;"><span class="font-mono text-xs text-muted">${escapeHtml(l.ip_address || '—')}</span></td>
          </tr>
        `;
      }).join('');
    }

    if (user) {
      document.getElementById('refresh-logs-btn').addEventListener('click', () => {
        showToast('Refreshing latest system logs...', 'info', 1000);
        loadLogs();
      });

      let searchDebounce;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(loadLogs, 300);
      });
      actionFilter.addEventListener('change', loadLogs);
      roleFilter.addEventListener('change', loadLogs);

      loadLogs();
    }
  </script>
</body>
</html>
