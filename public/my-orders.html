<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View and track your customer purchase orders on MarketHub.">
  <title>My Orders - MarketHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .order-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: all var(--transition-normal);
    }
    .order-header-bar {
      background: var(--neutral-50);
      padding: var(--space-4) var(--space-6);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
    }
    .order-meta-group {
      display: flex;
      gap: var(--space-6);
      flex-wrap: wrap;
    }
    .order-meta-item {
      display: flex;
      flex-direction: column;
    }
    .order-meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    .order-meta-value {
      font-weight: 700;
      color: var(--neutral-900);
      font-size: 0.95rem;
    }
    .order-tracker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      margin: var(--space-6) 0 var(--space-8);
      padding: 0 var(--space-4);
    }
    .order-tracker::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 36px;
      right: 36px;
      height: 3px;
      background: var(--neutral-200);
      z-index: 0;
    }
    .tracker-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      gap: var(--space-2);
    }
    .tracker-circle {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      border: 3px solid var(--neutral-300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--neutral-500);
      transition: all var(--transition-fast);
    }
    .tracker-step.completed .tracker-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }
    .tracker-step.active .tracker-circle {
      border-color: var(--primary);
      background: var(--bg-surface);
      color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .tracker-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--neutral-600);
      white-space: nowrap;
    }
    .tracker-step.completed .tracker-label,
    .tracker-step.active .tracker-label {
      color: var(--neutral-900);
      font-weight: 700;
    }
    .filter-pills {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }
    .filter-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 0.45rem 1rem;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--neutral-700);
    }
    .filter-pill:hover {
      background: var(--neutral-100);
    }
    .filter-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* --- ORDER ITEMS, THUMBNAILS & STAGE 3 ACTIONS --- */
    .order-item-thumb {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--neutral-100);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 1.3rem;
    }
    .order-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .order-item-link {
      color: var(--neutral-900);
      text-decoration: none;
      transition: color var(--transition-fast);
      display: inline-block;
      line-height: 1.3;
    }
    .order-item-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    .order-action-group {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      flex-wrap: nowrap;
    }
    .buy-again-btn {
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius-xs);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .buy-again-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .review-action-btn {
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius-xs);
      text-decoration: none;
      transition: all var(--transition-fast);
      font-weight: 600;
    }
    .btn-warning-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white !important;
      border: 1px solid #d97706;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.25);
    }
    .btn-warning-gold:hover {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
      transform: translateY(-1px);
    }
    .btn-review-outline {
      background: var(--bg-surface);
      color: #b45309 !important;
      border: 1px solid #fcd34d;
    }
    .btn-review-outline:hover {
      background: #fef3c7;
      border-color: #f59e0b;
      transform: translateY(-1px);
    }
    .btn-success {
      background: var(--success) !important;
      color: white !important;
      border-color: var(--success) !important;
    }

    /* --- INVOICE MODAL & PRINT STYLES --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1050;
      display: none;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .modal-overlay.is-active {
      display: flex;
    }
    .invoice-card {
      background: var(--bg-surface);
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .invoice-card-header {
      padding: var(--space-4) var(--space-6);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--neutral-50);
    }
    .invoice-card-body {
      padding: var(--space-6);
      overflow-y: auto;
    }
    .invoice-card-footer {
      padding: var(--space-4) var(--space-6);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      background: var(--neutral-50);
    }
    .invoice-brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }
    .invoice-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      padding: var(--space-4);
      background: var(--neutral-50);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    @media (max-width: 600px) {
      .invoice-meta-grid {
        grid-template-columns: 1fr;
      }
    }
    .invoice-summary-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-2) 0;
      font-size: 0.92rem;
    }
    .invoice-summary-row.total {
      border-top: 2px solid var(--border-subtle);
      margin-top: var(--space-2);
      padding-top: var(--space-3);
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--neutral-900);
    }
    @media print {
      body * {
        visibility: hidden !important;
      }
      #invoice-print-container, #invoice-print-container * {
        visibility: visible !important;
      }
      #invoice-print-container {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        padding: 24px !important;
        background: white !important;
        color: black !important;
        box-shadow: none !important;
        border: none !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Shared Navbar -->
  <div id="navbar"></div>

  <main class="py-8">
    <div class="container">

      <!-- Breadcrumbs & Header -->
      <div class="mb-6">
        <p class="text-muted" style="font-size: 0.88rem; margin-bottom: 4px;">
          <a href="index.html">Home</a> &rsaquo; <span>My Orders</span>
        </p>
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1>My Order History</h1>
            <p>Track delivery stages, view purchased items, and manage cancellations</p>
          </div>
          <a href="customer-dashboard.html" class="btn btn-secondary btn-sm">
            📊 Customer Dashboard
          </a>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-pills" id="status-filters">
        <button class="filter-pill active" onclick="filterOrders('All')">All Orders (<span id="count-all">3</span>)</button>
        <button class="filter-pill" onclick="filterOrders('Pending')">Pending (<span id="count-pending">1</span>)</button>
        <button class="filter-pill" onclick="filterOrders('Processing')">Processing (<span id="count-processing">1</span>)</button>
        <button class="filter-pill" onclick="filterOrders('Shipped')">Shipped (<span id="count-shipped">0</span>)</button>
        <button class="filter-pill" onclick="filterOrders('Delivered')">Delivered (<span id="count-delivered">1</span>)</button>
        <button class="filter-pill" onclick="filterOrders('Cancelled')">Cancelled (<span id="count-cancelled">0</span>)</button>
      </div>

      <!-- Orders List Container -->
      <div id="orders-container">
        <!-- Rendered dynamically via JavaScript -->
      </div>

      <!-- Empty State -->
      <div id="empty-orders-state" class="card text-center py-12" style="display: none;">
        <div class="card-body py-12">
          <div style="font-size: 3.5rem; margin-bottom: 1rem;">📦</div>
          <h2>No Orders Found</h2>
          <p class="text-muted" style="max-width: 440px; margin: 0 auto 1.5rem;">
            You haven't placed any orders matching this filter yet. Ready to start shopping?
          </p>
          <a href="products.html" class="btn btn-primary btn-lg">Browse Catalog</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Invoice / Receipt Printable Modal -->
  <div id="invoice-modal-overlay" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="invoice-card" id="invoice-print-container">
      <div class="invoice-card-header no-print">
        <div class="flex items-center gap-2">
          <span style="font-size: 1.25rem;">🧾</span>
          <h3 style="margin-bottom: 0; font-size: 1.1rem; color: var(--neutral-900);">Official Tax Invoice</h3>
        </div>
        <button type="button" class="btn btn-outline btn-sm" onclick="closeInvoiceModal()" style="padding: 2px 8px; border-radius: var(--radius-full); line-height: 1;">&times;</button>
      </div>

      <div class="invoice-card-body" id="invoice-modal-content">
        <!-- Rendered dynamically -->
      </div>

      <div class="invoice-card-footer no-print">
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeInvoiceModal()">Close</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="printInvoice()" style="display: inline-flex; align-items: center; gap: 4px;">
          🖨️ Print Invoice
        </button>
      </div>
    </div>
  </div>

  <!-- Global Toast & Scripts -->
  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    // Route guard: only Customer can access
    const currentUser = typeof requireRole === 'function' ? requireRole('Customer') : null;

    let customerOrders = [];
    let currentFilter = 'All';

    async function loadCustomerOrders() {
      const container = document.getElementById('orders-container');
      const emptyState = document.getElementById('empty-orders-state');

      try {
        container.innerHTML = `
          <div class="text-center py-12 text-muted" style="font-size: 0.95rem;">
            Loading your orders...
          </div>
        `;
        emptyState.style.display = 'none';

        const response = await apiFetch('/orders/my-orders');
        customerOrders = response.data || [];
        renderOrders();
      } catch (err) {
        console.error('Failed to load orders:', err);
        container.innerHTML = `
          <div class="alert alert-danger" style="margin-bottom: var(--space-4);">
            <span>Failed to load orders: ${escapeHtml(err.message || 'Server error')}</span>
          </div>
        `;
        showToast(err.message || 'Error connecting to orders service', 'error');
      }
    }

    function renderOrders() {
      const container = document.getElementById('orders-container');
      const emptyState = document.getElementById('empty-orders-state');

      const filtered = customerOrders.filter(o => {
        if (currentFilter === 'All') return true;
        return o.order_status === currentFilter;
      });

      // Update counters
      document.getElementById('count-all').textContent = customerOrders.length;
      document.getElementById('count-pending').textContent = customerOrders.filter(o => o.order_status === 'Pending').length;
      document.getElementById('count-processing').textContent = customerOrders.filter(o => o.order_status === 'Processing').length;
      document.getElementById('count-shipped').textContent = customerOrders.filter(o => o.order_status === 'Shipped').length;
      document.getElementById('count-delivered').textContent = customerOrders.filter(o => o.order_status === 'Delivered').length;
      document.getElementById('count-cancelled').textContent = customerOrders.filter(o => o.order_status === 'Cancelled').length;

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      container.innerHTML = filtered.map(order => {
        const isCancellable = order.order_status === 'Pending' || order.order_status === 'Processing';
        const badgeClass = getStatusBadgeClass(order.order_status);

        return `
          <div class="order-card" id="order-card-${order.order_id}">
            <!-- Order Header Bar -->
            <div class="order-header-bar">
              <div class="order-meta-group">
                <div class="order-meta-item">
                  <span class="order-meta-label">Order Number</span>
                  <span class="order-meta-value">#ORD-${order.order_id}</span>
                </div>
                <div class="order-meta-item">
                  <span class="order-meta-label">Date Placed</span>
                  <span class="order-meta-value">${formatDate(order.order_date)}</span>
                </div>
                <div class="order-meta-item">
                  <span class="order-meta-label">Total Amount</span>
                  <span class="order-meta-value" style="color: var(--primary);">$${Number(order.total_amount).toFixed(2)}</span>
                </div>
                <div class="order-meta-item">
                  <span class="order-meta-label">Payment</span>
                  <span class="badge ${order.payment_status === 'Paid' ? 'badge-success' : 'badge-warning'}">
                    ${order.payment_status}
                  </span>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <span class="badge ${badgeClass}" style="font-size: 0.85rem; padding: 0.35rem 0.85rem;">
                  ${order.order_status}
                </span>
                <button class="btn btn-outline btn-sm" onclick="viewInvoice(${order.order_id})" style="display: inline-flex; align-items: center; gap: 4px;">
                  📄 Invoice
                </button>
                ${isCancellable ? `
                  <button class="btn btn-danger btn-sm" onclick="cancelOrder(${order.order_id}, this)">
                    Cancel Order
                  </button>
                ` : `
                  <button class="btn btn-secondary btn-sm" disabled title="Orders cannot be cancelled once Shipped or Delivered">
                    Cancellation Locked
                  </button>
                `}
              </div>
            </div>

            <div class="card-body">
              <!-- Visual Order Progression Tracker (unless cancelled) -->
              ${order.order_status !== 'Cancelled' ? renderTracker(order.order_status) : `
                <div class="alert alert-danger mb-6">
                  <span>❌ This order was cancelled. Stock has been restored and payment status updated.</span>
                </div>
              `}

              <!-- Shipping Address -->
              <div class="mb-4" style="font-size: 0.88rem; color: var(--neutral-600);">
                📍 <strong>Shipping To:</strong> ${escapeHtml(order.shipping_address)}
              </div>

              <!-- Order Items List -->
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th style="min-width: 240px;">Product Description</th>
                      <th>Seller</th>
                      <th class="text-center">Quantity</th>
                      <th class="text-right">Price</th>
                      <th class="text-right">Subtotal</th>
                      <th class="text-right" style="min-width: 210px;">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${order.items.map(item => {
                      const isDelivered = order.order_status === 'Delivered' || item.item_status === 'Delivered';
                      const canReview = order.order_status !== 'Cancelled';
                      const productEmoji = getProductEmoji(item.product_name);

                      return `
                      <tr>
                        <td>
                          <div class="flex items-center gap-3">
                            <div class="order-item-thumb">
                              ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.product_name)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                              <div class="order-item-emoji-placeholder" style="${item.image ? 'display:none;' : ''}">${productEmoji}</div>
                            </div>
                            <div>
                              <a href="product-details.html?id=${item.product_id}" class="order-item-link font-semibold">
                                ${escapeHtml(item.product_name)}
                              </a>
                              <div class="text-muted" style="font-size: 0.76rem; margin-top: 2px;">
                                Item Status: <span class="badge ${item.item_status === 'Delivered' ? 'badge-success' : 'badge-neutral'}" style="font-size: 0.7rem; padding: 1px 6px;">${item.item_status || order.order_status}</span>
                              </div>
                            </div>
                          </div>
                        </td>
                        <td class="text-muted" style="vertical-align: middle;">${escapeHtml(item.seller_name)}</td>
                        <td class="text-center font-semibold" style="vertical-align: middle;">${item.quantity}</td>
                        <td class="text-right" style="vertical-align: middle;">$${Number(item.price).toFixed(2)}</td>
                        <td class="text-right font-semibold" style="vertical-align: middle;">$${Number(item.subtotal).toFixed(2)}</td>
                        <td class="text-right" style="vertical-align: middle;">
                          <div class="order-action-group">
                            <button class="btn btn-outline btn-sm buy-again-btn" 
                                    data-product-id="${item.product_id}" 
                                    data-product-name="${escapeHtml(item.product_name)}" 
                                    onclick="handleBuyAgain(this)"
                                    title="Add this item back into your cart">
                              <span>🔄</span> <span>Buy Again</span>
                            </button>
                            ${isDelivered ? `
                              <a href="product-details.html?id=${item.product_id}#customer-reviews-section" 
                                 class="btn btn-sm review-action-btn btn-warning-gold" 
                                 title="Share your review for this delivered item">
                                <span>⭐</span> <span>Write a Review</span>
                              </a>
                            ` : canReview ? `
                              <a href="product-details.html?id=${item.product_id}#customer-reviews-section" 
                                 class="btn btn-sm review-action-btn btn-review-outline" 
                                 title="Write a review for this purchase">
                                <span>⭐</span> <span>Review</span>
                              </a>
                            ` : ''}
                          </div>
                        </td>
                      </tr>
                    `}).join('')}
                  </tbody>
                </table>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function renderTracker(status) {
      const steps = ['Placed', 'Processing', 'Shipped', 'Delivered'];
      const statusMap = {
        'Pending': 0,
        'Processing': 1,
        'Shipped': 2,
        'Delivered': 3
      };
      const activeIdx = statusMap[status] !== undefined ? statusMap[status] : 0;

      return `
        <div class="order-tracker">
          ${steps.map((label, idx) => {
            let stateClass = '';
            let icon = idx + 1;
            if (idx < activeIdx) {
              stateClass = 'completed';
              icon = '✓';
            } else if (idx === activeIdx) {
              stateClass = 'active';
            }
            return `
              <div class="tracker-step ${stateClass}">
                <div class="tracker-circle">${icon}</div>
                <div class="tracker-label">${label}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function getStatusBadgeClass(status) {
      switch (status) {
        case 'Pending': return 'badge-warning';
        case 'Processing': return 'badge-primary';
        case 'Shipped': return 'badge-primary';
        case 'Delivered': return 'badge-success';
        case 'Cancelled': return 'badge-danger';
        default: return 'badge-neutral';
      }
    }

    async function cancelOrder(orderId, btnElement) {
      const order = customerOrders.find(o => o.order_id === orderId);
      if (!order) return;

      if (!['Pending', 'Processing'].includes(order.order_status)) {
        showToast('Only Pending or Processing orders can be cancelled.', 'error');
        return;
      }

      const confirmed = confirm(`Are you sure you want to cancel Order #ORD-${orderId}? Purchased items will be restored to inventory and payment will be refunded.`);
      if (!confirmed) return;

      let originalBtnText = '';
      if (btnElement) {
        originalBtnText = btnElement.textContent;
        btnElement.disabled = true;
        btnElement.textContent = 'Cancelling...';
      }

      try {
        const response = await apiFetch(`/orders/${orderId}/cancel`, {
          method: 'PATCH'
        });

        showToast(response.message || `Order #ORD-${orderId} has been successfully cancelled.`, 'success', 3500);
        await loadCustomerOrders();
      } catch (err) {
        console.error('Failed to cancel order:', err);
        showToast(err.message || 'Failed to cancel order.', 'error');
        if (btnElement) {
          btnElement.disabled = false;
          btnElement.textContent = originalBtnText;
        }
      }
    }

    function filterOrders(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.startsWith(status));
      });
      renderOrders();
    }

    function formatDate(dtStr) {
      try {
        const d = new Date(dtStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dtStr;
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function getProductEmoji(name) {
      const lower = (name || '').toLowerCase();
      if (lower.includes('headphone') || lower.includes('audio') || lower.includes('sound')) return '🎧';
      if (lower.includes('keyboard') || lower.includes('mouse')) return '⌨️';
      if (lower.includes('jacket') || lower.includes('trouser') || lower.includes('shoes') || lower.includes('shirt')) return '👕';
      if (lower.includes('fryer') || lower.includes('bottle') || lower.includes('cook')) return '🍳';
      if (lower.includes('book') || lower.includes('programmer') || lower.includes('code')) return '📚';
      if (lower.includes('serum') || lower.includes('oil') || lower.includes('beauty')) return '🧴';
      if (lower.includes('dumbbell') || lower.includes('sport') || lower.includes('fitness')) return '🏋️';
      return '📦';
    }

    async function handleBuyAgain(btnElement) {
      const productId = parseInt(btnElement.getAttribute('data-product-id'), 10);
      const productName = btnElement.getAttribute('data-product-name') || 'Item';
      await buyAgain(productId, productName, btnElement);
    }

    async function buyAgain(productId, productName, btnElement) {
      if (!productId) return;

      let originalHtml = '';
      if (btnElement) {
        originalHtml = btnElement.innerHTML;
        btnElement.disabled = true;
        btnElement.innerHTML = `<span>⏳ Adding...</span>`;
      }

      try {
        const response = await apiFetch('/cart', {
          method: 'POST',
          body: { product_id: productId, quantity: 1 }
        });

        if (btnElement) {
          btnElement.innerHTML = `<span>✓ Added!</span>`;
          btnElement.classList.add('btn-success');
        }

        showToast(
          `🛒 Added <strong>${escapeHtml(productName)}</strong> to cart! <a href="cart.html" style="color:var(--primary); font-weight:700; text-decoration:underline; margin-left:8px;">View Cart &rarr;</a>`,
          'success',
          4500
        );

        setTimeout(() => {
          if (btnElement) {
            btnElement.disabled = false;
            btnElement.classList.remove('btn-success');
            btnElement.innerHTML = originalHtml;
          }
        }, 1800);

      } catch (err) {
        console.error('Buy Again failed:', err);
        showToast(err.message || 'Unable to re-order product at this time.', 'warning', 4000);
        if (btnElement) {
          btnElement.disabled = false;
          btnElement.innerHTML = originalHtml;
        }
      }
    }

    async function viewInvoice(orderId) {
      const overlay = document.getElementById('invoice-modal-overlay');
      const content = document.getElementById('invoice-modal-content');

      overlay.classList.add('is-active');
      content.innerHTML = `
        <div class="text-center py-12 text-muted" style="font-size: 0.95rem;">
          Loading invoice details for Order #ORD-${orderId}...
        </div>
      `;

      try {
        const res = await apiFetch(`/orders/${orderId}`);
        const inv = res.data;

        content.innerHTML = `
          <!-- Invoice Header -->
          <div class="flex items-start justify-between flex-wrap gap-4 mb-6">
            <div>
              <div class="invoice-brand">🛒 MarketHub</div>
              <p class="text-muted" style="font-size: 0.82rem; margin-top: 2px; margin-bottom: 0;">Multi-Vendor Marketplace Platform</p>
            </div>
            <div class="text-right">
              <span class="badge ${getStatusBadgeClass(inv.order_status)}" style="font-size: 0.8rem; margin-bottom: 4px;">${inv.order_status}</span>
              <div style="font-weight: 700; font-size: 1.05rem; color: var(--neutral-900);">Invoice #ORD-${inv.order_id}</div>
              <div class="text-muted" style="font-size: 0.82rem;">Date: ${formatDate(inv.order_date)}</div>
            </div>
          </div>

          <!-- Customer & Shipping Meta Grid -->
          <div class="invoice-meta-grid">
            <div>
              <span class="order-meta-label">Billed & Shipped To</span>
              <div class="font-bold" style="color: var(--neutral-900); font-size: 0.95rem; margin-top: 2px;">${escapeHtml(inv.customer.name)}</div>
              <div class="text-muted" style="font-size: 0.85rem;">${escapeHtml(inv.customer.email)}</div>
              <div class="text-muted" style="font-size: 0.85rem;">Ph: ${escapeHtml(inv.customer.mobile || 'N/A')}</div>
              <div style="font-size: 0.88rem; margin-top: 6px; color: var(--neutral-800);">${escapeHtml(inv.shipping_address)}</div>
            </div>
            <div>
              <span class="order-meta-label">Payment Information</span>
              <div class="flex items-center gap-2 mt-1">
                <span class="badge ${inv.payment_status === 'Paid' ? 'badge-success' : 'badge-warning'}">${inv.payment_status}</span>
                <span style="font-size: 0.85rem; color: var(--neutral-600);">${inv.payment_status === 'Paid' ? 'Direct Payment Confirmed' : 'Pending Verification'}</span>
              </div>
              <div style="margin-top: var(--space-4);">
                <span class="order-meta-label">Order Fulfillment</span>
                <div style="font-size: 0.85rem; color: var(--neutral-700); margin-top: 2px;">Multi-vendor fulfillment across ${inv.items.length} item(s)</div>
              </div>
            </div>
          </div>

          <!-- Line Items Table -->
          <div class="table-responsive mb-6">
            <table class="table">
              <thead>
                <tr>
                  <th>Product Description</th>
                  <th>Merchant</th>
                  <th class="text-center">Qty</th>
                  <th class="text-right">Unit Price</th>
                  <th class="text-right">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                ${inv.items.map(item => `
                  <tr>
                    <td>
                      <a href="product-details.html?id=${item.product_id}" target="_blank" style="color: inherit; text-decoration: none; font-weight: 700;">
                        ${escapeHtml(item.product_name)}
                      </a>
                      <div class="text-muted" style="font-size: 0.78rem;">Status: <span class="badge badge-neutral" style="font-size: 0.7rem; padding: 1px 6px;">${item.item_status}</span></div>
                    </td>
                    <td class="text-muted" style="font-size: 0.85rem;">${escapeHtml(item.seller_name)}</td>
                    <td class="text-center font-semibold">${item.quantity}</td>
                    <td class="text-right">$${Number(item.unit_price).toFixed(2)}</td>
                    <td class="text-right font-semibold">$${Number(item.subtotal).toFixed(2)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <!-- Financial Breakdown Summary -->
          <div class="flex justify-end">
            <div style="width: 100%; max-width: 300px;">
              <div class="invoice-summary-row">
                <span class="text-muted">Items Subtotal:</span>
                <span class="font-semibold">$${inv.pricing.subtotal.toFixed(2)}</span>
              </div>
              <div class="invoice-summary-row">
                <span class="text-muted">Estimated Tax (5% GST):</span>
                <span class="font-semibold">$${inv.pricing.tax.toFixed(2)}</span>
              </div>
              <div class="invoice-summary-row total">
                <span>Grand Total:</span>
                <span style="color: var(--primary);">$${inv.pricing.total.toFixed(2)}</span>
              </div>
            </div>
          </div>

          <!-- Invoice Footer Notice -->
          <div class="mt-6 pt-4 text-center text-muted" style="border-top: 1px dashed var(--border-subtle); font-size: 0.8rem;">
            Thank you for shopping with MarketHub! For queries regarding vendor fulfillment or returns, please reference Order #ORD-${inv.order_id}.
          </div>
        `;

      } catch (err) {
        console.error('Failed to load invoice:', err);
        content.innerHTML = `
          <div class="alert alert-danger" style="margin-bottom: 0;">
            <span>Failed to load invoice: ${escapeHtml(err.message || 'Server error')}</span>
          </div>
        `;
      }
    }

    function closeInvoiceModal() {
      document.getElementById('invoice-modal-overlay').classList.remove('is-active');
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'invoice-modal-overlay') {
        closeInvoiceModal();
      }
    }

    function printInvoice() {
      window.print();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check for query param from checkout
      const params = new URLSearchParams(window.location.search);
      if (params.get('orderPlaced') === 'true') {
        showToast('🎉 Your new order was placed successfully!', 'success', 4000);
      }
      if (currentUser) {
        loadCustomerOrders();
      }
    });
  </script>
</body>
</html>
