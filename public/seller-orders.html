<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | Seller Portal</title>
  <link rel="stylesheet" href="css/seller.css">
</head>
<body>
  <button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="seller-sidebar">Menu</button>
  <div class="app">
    <aside class="sidebar" id="seller-sidebar" aria-label="Seller navigation"></aside>

    <main class="content">
      <header class="page-header">
        <div>
          <h1>Orders</h1>
          <p>Items from customer orders that include your products.</p>
        </div>
      </header>

      <p class="demo-note">Mock orders. Status changes are not available yet.</p>

      <section class="card" aria-label="Order list">
        <form class="toolbar" role="search" onsubmit="return false">
          <div class="field field--grow">
            <label for="search">Search orders</label>
            <input type="search" id="search" placeholder="Order ID, product, customer or reference&hellip;" autocomplete="off">
          </div>
          <div class="field">
            <label for="filter-status">Status</label>
            <select id="filter-status">
              <option value="">All statuses</option>
              <option>Pending</option>
              <option>Processing</option>
              <option>Shipped</option>
              <option>Delivered</option>
              <option>Cancelled</option>
            </select>
          </div>
        </form>

        <div class="table-wrap" id="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Order ID</th><th scope="col">Product</th>
                <th scope="col" class="num">Qty</th><th scope="col">Date</th>
                <th scope="col">Customer / Reference</th><th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="order-rows"></tbody>
          </table>
        </div>

        <div class="empty" id="empty-state" hidden>
          <h3>No matching orders</h3>
          <p>Try a different search or status filter.</p>
        </div>
        <p class="sub" id="result-count" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="js/seller-data.js"></script>
  <script src="js/seller-layout.js"></script>
  <script src="js/seller-orders.js"></script>
</body>
</html>
