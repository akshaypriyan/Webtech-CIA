<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MarketHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="py-12">
    <div class="container">
      <div class="card">
        <div class="card-header flex justify-between items-center">
          <h3>🛡️ Administrator Console</h3>
          <span class="badge badge-warning">Member 4 Workspace</span>
        </div>
        <div class="card-body py-12 text-center">
          <div style="font-size: 3rem; margin-bottom: 1rem;">⚙️</div>
          <h2 id="admin-greeting">Welcome, Admin!</h2>
          <p class="text-muted" style="max-width: 500px; margin: 0 auto 1.5rem;">
            You have authenticated as an Administrator. This slice is owned by 
            Member 4 (User Moderation, Categories, and Governance).
          </p>
          <div class="flex justify-center gap-4">
            <a href="index.html" class="btn btn-secondary">Storefront</a>
            <button onclick="logout()" class="btn btn-danger">Log Out</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    const user = requireRole('Admin', 'Super Admin');
    if (user) {
      document.getElementById('admin-greeting').textContent = `Welcome back, ${user.name}!`;
    }
  </script>
</body>
</html>
